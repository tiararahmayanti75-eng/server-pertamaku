<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Halaman Register</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md border border-slate-100">
        <h1 class="text-2xl font-bold text-blue-600 mb-6 text-center">Daftar Akun Baru 📝</h1>
        
        <div id="alertBox" class="mb-4 hidden p-3 rounded-lg text-sm font-medium bg-red-100 text-red-700 border border-red-200"></div>

        <form action="/register" method="POST" class="space-y-4">
            <div>
                <label class="block text-slate-700 font-medium mb-1">Username:</label>
                <input type="text" name="username" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-slate-700 font-medium mb-1">Password:</label>
                <input type="password" name="password" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-slate-700 font-medium mb-1">Konfirmasi Password:</label>
                <input type="password" name="confirmPassword" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-2 rounded-lg hover:bg-blue-700 transition">Register</button>
        </form>
        
        <p class="mt-4 text-center text-sm text-slate-600">Sudah punya akun? <a href="/login" class="text-blue-600 font-medium hover:underline">Login di sini</a></p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        if (error) {
            const alertBox = document.getElementById('alertBox');
            alertBox.textContent = error;
            alertBox.classList.remove('hidden');
        }
    </script>
</body>
</html>
